controller_manager:
  update_rate: 100  # Hz

spot_arm_controller:
  type: position_controllers/JointTrajectoryController
  joints:
    - arm0_sh0
    - arm0_sh1
    - arm0_el0
    - arm0_el1
    - arm0_wr0
    - arm0_wr1
  gains:
    arm0_sh0: {p: 0, i: 0, d: 0}
    arm0_sh1: {p: 0, i: 0, d: 0}
    arm0_el0: {p: 0, i: 0, d: 0}
    arm0_el1: {p: 0, i: 0, d: 0}
    arm0_wr0: {p: 0, i: 0, d: 0}
    arm0_wr1: {p: 0, i: 0, d: 0}

spot_gripper_controller:
  type: position_controllers/GripperActionController
  joint: arm0_f1x
  goal_tolerance: 0.01
  stop_tolerance: 0.01
  state_publish_rate: 50.0

joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 50
